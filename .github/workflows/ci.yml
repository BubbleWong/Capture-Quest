name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run game logic tests
        run: npm test

      - name: Run live socket smoke test
        run: |
          PORT=3001 CAPTURE_QUEST_MODE=production CAPTURE_QUEST_SKIP_LOCAL_CONFIG=1 npm start > /tmp/capture-quest.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/capture-quest.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/api/health
          TEST_BASE_URL=http://127.0.0.1:3001 npm run smoke
