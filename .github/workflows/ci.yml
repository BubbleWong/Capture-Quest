name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "24.x"
          - "22.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run game logic tests
        run: npm test

      - name: Build public assets and check the Worker bundle
        run: |
          npm run build
          npx wrangler deploy --dry-run --config cloudflare/wrangler.jsonc

      - name: Run native WebSocket 50-player game
        run: npm run test:hybrid
        env:
          CAPTURE_QUEST_SKIP_LOCAL_CONFIG: '1'
          HYBRID_GATE_PORT: '3199'
